<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- === Core SEO tags === -->
    <title>TestMandi — Buy & Sell MCQ Practice Tests for NEET, JEE, UPSC, SSC & More</title>
    <meta name="description" content="TestMandi is India's marketplace for exam-prep MCQ tests. Buy practice tests for NEET, JEE Main, UPSC, SSC, Banking, GATE, and 30+ competitive exams — or sell your own tests as a teacher or institute." />
    <meta name="keywords" content="MCQ test, mock test, NEET practice test, JEE mock test, UPSC prelims practice, SSC CGL mock test, exam preparation, online test series, competitive exam practice" />
    <link rel="canonical" href="https://testmandi.in/" />
    <meta name="robots" content="index, follow" />

    <!-- === Open Graph (Facebook, WhatsApp, LinkedIn link previews) === -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TestMandi" />
    <meta property="og:title" content="TestMandi — Buy & Sell MCQ Practice Tests for Competitive Exams" />
    <meta property="og:description" content="Practice tests for NEET, JEE Main, UPSC, SSC, Banking, GATE, and 30+ competitive exams. Instant score reports with topic-wise breakdowns." />
    <meta property="og:url" content="https://testmandi.in/" />
    <meta property="og:image" content="https://testmandi.in/og-image.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- === Twitter/X card === -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TestMandi — MCQ Practice Tests for Competitive Exams" />
    <meta name="twitter:description" content="Buy or sell MCQ practice tests for NEET, JEE, UPSC, SSC, Banking, GATE and more." />
    <meta name="twitter:image" content="https://testmandi.in/og-image.png" />

    <!-- Favicon — replace these files in /public with your real ones -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- === Structured data: tells Google exactly what this business is === -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TestMandi",
      "url": "https://testmandi.in",
      "logo": "https://testmandi.in/logo.png",
      "description": "India's marketplace for exam-prep MCQ tests, connecting teachers and institutes with students preparing for competitive exams.",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TestMandi",
      "url": "https://testmandi.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://testmandi.in/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
